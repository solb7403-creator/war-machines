function cloudLoad(cb){
 if(!CLOUD_OK)return cb(null);
 let done=false;const fin=v=>{if(!done){done=true;cb(v);}};
 setTimeout(()=>fin(null),4000);
 try{TG.CloudStorage.getItem('wm_n',(err,nv)=>{
  const n=parseInt(nv||'0',10);if(err||!n)return fin(null);
  const keys=[];for(let i=0;i<n;i++)keys.push('wm_s'+i);
  TG.CloudStorage.getItems(keys,(e2,vals)=>{
   if(e2||!vals)return fin(null);
   try{fin(JSON.parse(keys.map(k=>vals[k]||'').join('')));}catch(e){fin(null);}
  });
 });}catch(e){fin(null);}

 if(typeof save.earned!=='number'){let sp=0;for(const k in (save.up||{}))for(let i=0;i<save.up[k];i++)sp+=(UPS[k]?UPS[k].costs[i]:0);save.earned=(save.pts||0)+sp;}

  (save.invC||[]).forEach(id=>{const i=parseInt(String(id).slice(1));if(!isNaN(i)){const c=CA[(i/25)|0];save.cTier[c]=Math.max(save.cTier[c],TI[i%25]);}});

 }}

const UPS={

 cannon:{n:'CANNON',d:'+8% damage per level',c:'#ff6b5e',costs:[100,250,500,1000]},

const CHORDER=['scout','vanguard','titan'];

 pulse:{n:'PULSE CANNON',d:'Standard balanced gun',dps:70,shot:0.2,c:'#3fd0c9',sup:'PIERCE LANCE'},

function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const TIER_N=['COMMON','RARE','EPIC'],TIER_MULT=[1.0,1.12,1.28];

// ---- gear: 3 chassis classes x 3 tiers, 3 weapons x 3 tiers. Higher tier is ALWAYS better. ----
function getW(arch){
 if(arch==='moon'){
  const b=WEAPONS.moon;
  return {id:'moon',arch:'moon',tier:2,name:b.n,dps:b.dps,shot:b.shot,pspd:26,premium:true};

 return {id:arch,arch,tier:t,name:b.n,dps:Math.round(b.dps*mt),shot:b.shot,pspd:22};
}
function getC(cls){
 const t=(save.cTier&&save.cTier[cls])||0,mt=TIER_MULT[t],b=CH[cls]||CH.vanguard;
 return {id:cls,cls,tier:t,name:b.n,hp:Math.round(b.hp*mt*100)/100,spd:Math.round(b.spd*(1+(mt-1)*0.5)*100)/100,turn:b.turn,size:b.ds};
}
const BOXODDS=[[0.70,0.25,0.05],[0.25,0.60,0.15],[0,0.30,0.70]];
function rollItem(cat,ri){
 const isW=cat==='w';
 const keys=isW?['pulse','twin','siege']:['scout','vanguard','titan'];

function qp(id,val,isMax){

// ---- points: every PTS award flows through here so daily/weekly boards stay accurate
function dayId(d){return d.toISOString().slice(0,10);}
function weekId(d){   // ISO week, YYYY-Www (UTC)
 const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
 const day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day+3);
 const first=new Date(Date.UTC(t.getUTCFullYear(),0,4));
 const fday=(first.getUTCDay()+6)%7;first.setUTCDate(first.getUTCDate()-fday+3);
 const w=1+Math.round((t-first)/(7*864e5));
 return t.getUTCFullYear()+'-W'+String(w).padStart(2,'0');
}
function rollPeriods(){
 const now=new Date(),d=dayId(now),w=weekId(now);
 if(save.dailyDate!==d){save.dailyDate=d;save.dailyPts=0;}
 if(save.weeklyId!==w){save.weeklyId=w;save.weeklyPts=0;}
}
// must match the Firebase rules (database.rules.json)
const DAILY_CAP=20000,SYNC_STEP=1500,SYNC_GAP=26000;
function awardPts(n){
 if(!n||n<=0)return;
 rollPeriods();
 n=Math.min(n,Math.max(0,DAILY_CAP-(save.dailyPts||0)));
 if(n<=0){showToast('DAILY POINT CAP REACHED');return;}
 save.pts=(save.pts||0)+n;
 save.earned=(save.earned||0)+n;
 save.dailyPts=(save.dailyPts||0)+n;
 save.weeklyPts=(save.weeklyPts||0)+n;
 store();syncPlayer();
}

let scene3d=null,camera3d=null,renderer3d=null,tankMe3d=null,tankBot3d=null,walls3d=[],bullets3d=[],bridge3d=null;
function init3D(){
 const cv3=document.getElementById('c3d');
 cv3.style.display='block';
 document.getElementById('c').style.display='none';
 if(renderer3d){renderer3d.setSize(vw,vh);return;}

 // angled top-down camera (behind south edge, looking north)
 camera3d.position.set(10,26,44);

 // lights

 sun.position.set(15,25,10);sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 scene3d.add(sun);
 const moon=new THREE.PointLight(0xe8f4ff,0.6,60);
 moon.position.set(-5,12,8);scene3d.add(moon);
 // ground (lunar surface)
 const gg=new THREE.PlaneGeometry(24,36);
 const gm=new THREE.MeshStandardMaterial({color:0x232733,roughness:0.9});
 const ground=new THREE.Mesh(gg,gm);
 ground.rotation.x=-Math.PI/2;ground.position.set(10,0,16);
 ground.receiveShadow=true;scene3d.add(ground);
 // stars
 const sg=new THREE.BufferGeometry(),sp=[];
 for(let i=0;i<300;i++)sp.push((Math.random()-0.5)*120,15+Math.random()*40,(Math.random()-0.5)*120);
 sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
 scene3d.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.3})));
}
function buildTank3d(color){
 const grp=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.6,1.8),
  new THREE.MeshStandardMaterial({color:color,roughness:0.4,metalness:0.6}));
 body.position.y=0.5;body.castShadow=true;grp.add(body);
 const turret=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.55,0.4,12),
  new THREE.MeshStandardMaterial({color:0x2a2e40,roughness:0.3,metalness:0.7}));
 turret.position.y=0.95;turret.castShadow=true;grp.add(turret);
 const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.4,8),
  new THREE.MeshStandardMaterial({color:0x111420,roughness:0.2,metalness:0.8}));
 barrel.rotation.x=Math.PI/2;barrel.position.set(0,0.95,0.9);grp.add(barrel);
 // gems on corners
 for(const [gx,gz] of [[-0.6,-0.7],[0.6,-0.7],[-0.6,0.7],[0.6,0.7]]){
  const gem=new THREE.Mesh(new THREE.OctahedronGeometry(0.16),
   new THREE.MeshStandardMaterial({color:0x3fd0c9,emissive:0x3fd0c9,emissiveIntensity:0.8}));
  gem.position.set(gx,0.85,gz);grp.add(gem);
 }
 return grp;
}
function buildArena3d(){
 // clear old
 for(const m of walls3d)scene3d.remove(m);walls3d=[];
 if(bridge3d){scene3d.remove(bridge3d);bridge3d=null;}
 // walls
 for(const [x,y,w,h] of walls){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,1.5,h),
   new THREE.MeshStandardMaterial({color:0x4a4e5e,roughness:0.8}));
  m.position.set(x+w/2,0.75,y+h/2);m.castShadow=true;m.receiveShadow=true;
  scene3d.add(m);walls3d.push(m);
 }
 // bridge (real 3D!)
 try{
 const br=MAPS[curMap]&&MAPS[curMap].bridge;
 if(br&&br.segs){
  bridge3d=new THREE.Group();
  for(const [sx,sy,sw,sh] of br.segs){
   const deck=new THREE.Mesh(new THREE.BoxGeometry(sw,0.5,sh),
    new THREE.MeshStandardMaterial({color:0x3d4260,roughness:0.7}));
   deck.position.set(sx+sw/2,2.2,sy+sh/2);deck.castShadow=true;deck.receiveShadow=true;
   bridge3d.add(deck);
   // support pillars
   for(const px of [sx+sw*0.25,sx+sw*0.75]){
    const pil=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.35,2.2,8),
     new THREE.MeshStandardMaterial({color:0x2a2e40}));
    pil.position.set(px,1.1,sy+sh/2);pil.castShadow=true;bridge3d.add(pil);
   }
  }
  // ramps
  for(const [rx,ry,rw,rh] of br.ramps){
   const ramp=new THREE.Mesh(new THREE.BoxGeometry(rw,0.3,rh),
    new THREE.MeshStandardMaterial({color:0x5a6080,roughness:0.8}));
   ramp.position.set(rx+rw/2,0.4,ry+rh/2);
   ramp.rotation.x=(ry<br.y?0.25:-0.25);ramp.castShadow=true;
   bridge3d.add(ramp);
  }
  scene3d.add(bridge3d);
 }

function calcPower(){
 const U=save.up,W=getW(save.weapon),Cc=getC(save.chassis);
 const skinM=save.skin==='lunar'?1.08:1;
 const hp=STAT.hp*(1+0.08*U.hull)*Cc.hp*skinM;
 const dps=W.dps*(1+0.08*U.cannon)*skinM;
 const spd=(1+0.06*U.engine)*Cc.spd;
 let coreM=1;
 for(const c of (save.cores||[])){
  if(c){const lv=(save.gemLvl&&save.gemLvl[c])||1;coreM*=(1+0.05*lv);}
 }
 // geometric mean scaled so starter ≈ 100
 return Math.round(Math.pow(hp*dps*spd,1/3)*coreM*1.2);
}

// Send real TON payment via connected wallet. Amount in GRAM (=TON).
// onSuccess() is called after the transaction is confirmed.
// Fallback: if the wallet app doesn't return to the page after paying (common on iOS),
// verify the payment directly on the TON blockchain so the purchase still goes through.
async function verifyPurchaseOnChain(gramAmount,sinceTs,timeoutMs,isDone){
 const t0=Date.now();
 while(Date.now()-t0<timeoutMs){
  if(isDone())return false;
  try{
   const r=await fetch('https://toncenter.com/api/v2/getTransactions?address='+TON_RECIPIENT+'&limit=20');
   const d=await r.json();
   for(const t of (d.result||[])){
    if((t.utime*1000)<sinceTs-10000)continue;
    const val=parseInt(((t.in_msg||{}).value||'0'),10)/1e9;
    if(val+1e-9>=gramAmount)return true;
   }
  }catch(e){}
  await new Promise(r=>setTimeout(r,5000));
 }
 return false;
}

const corners=[];
for(const [x,y,w,h] of walls)for(const sx of [-1,1])for(const sy of [-1,1]){
 const px=(sx<0?x:x+w)+sx*(R+0.45),py=(sy<0?y:y+h)+sy*(R+0.45);
 if(px>R&&px<W-R&&py>R&&py<H-R&&!walls.some(([rx,ry,rw,rh])=>px>rx-R&&px<rx+rw+R&&py>ry-R&&py<ry+rh+R))corners.push({x:px,y:py});

const dist2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clampP=(x,y)=>({x:Math.max(R,Math.min(W-R,x)),y:Math.max(R,Math.min(H-R,y))});
// cover never moves, so corner-to-corner visibility is computed once
const cAdj=corners.map((a,i)=>corners.map((c,j)=>i!==j&&los(a,c)?dist2(a,c):0));
// next point to steer to: straight there if clear, else the first hop of the shortest route around cover
function waypoint(from,to){
 if(los(from,to))return to;
 const n=corners.length,dd=Array(n).fill(1e9),prev=Array(n).fill(-1),done=Array(n).fill(false);
 const gv=corners.map(c=>los(c,to)?dist2(c,to):0);
 corners.forEach((c,i)=>{if(los(from,c))dd[i]=dist2(from,c);});
 for(let k=0;k<n;k++){
  let u=-1;for(let i=0;i<n;i++)if(!done[i]&&dd[i]<1e9&&(u<0||dd[i]<dd[u]))u=i;
  if(u<0)break;done[u]=true;
  for(let v=0;v<n;v++)if(cAdj[u][v]&&dd[u]+cAdj[u][v]<dd[v]){dd[v]=dd[u]+cAdj[u][v];prev[v]=u;}
 }
 let best=-1,bc=1e9;
 for(let i=0;i<n;i++)if(gv[i]&&dd[i]<1e9&&dd[i]+gv[i]<bc){bc=dd[i]+gv[i];best=i;}
 if(best<0)return to;
 const path=[];for(let i=best;i>=0;i=prev[i])path.unshift(corners[i]);
 for(const c of path)if(dist2(from,c)>0.5)return c;      // skip corners we are already standing on

}
// nearest spot behind a cover block that is hidden from the threat
function coverSpot(from,threat){
 let best=null,bd=1e9;
 for(const [x,y,w,h] of walls){
  const cx=x+w/2,cy=y+h/2,dx=cx-threat.x,dy=cy-threat.y,d=Math.hypot(dx,dy)||1,off=Math.hypot(w,h)/2+R+0.6;
  const s=clampP(cx+dx/d*off,cy+dy/d*off);
  if(los(s,threat))continue;
  const t=dist2(from,s);if(t<bd){bd=t;best=s;}

}

  const [ix,iy]=inputVec();
  me.x+=ix*STAT.speed*spdMult(me)*(me.sup?0.6:1)*dt;me.y+=iy*STAT.speed*spdMult(me)*(me.sup?0.6:1)*dt;push(me);

   g.globalAlpha=0.15+0.3*k;g.strokeStyle='#ff3b3b';g.lineWidth=3;
   g.beginPath();g.arc(X(r.x),Y(r.y),S.r*sc,0,7);g.stroke();g.globalAlpha=1;
  }else{
   const len=S.kind==='beam'?S.len:beamLen(r,r.sup.ang),wdt=S.kind==='beam'?S.w:1.2;
   g.save();g.translate(X(r.x),Y(r.y));g.rotate(r.sup.ang);g.globalAlpha=0.12+0.28*k;g.fillStyle='#ff3b3b';
   g.fillRect(0,-wdt*sc,len*sc,wdt*2*sc);g.globalAlpha=0.5+0.5*k;g.fillStyle='#ffb3b3';g.fillRect(0,-1,len*sc,2);g.restore();g.globalAlpha=1;
  }
 }
 for(const bm of beams){g.globalAlpha=Math.min(1,bm.t/0.15);g.strokeStyle=bm.c;g.lineWidth=Math.max(6,sc*0.9*(bm.w||1.25));g.lineCap='round';
  g.beginPath();g.moveTo(X(bm.ax),Y(bm.ay));g.lineTo(X(bm.bx),Y(bm.by));g.stroke();g.strokeStyle='#fff';g.lineWidth=Math.max(2,sc*0.3);g.stroke();g.lineCap='butt';g.globalAlpha=1;}
 for(const sh of shells){
  const sx=X(sh.x),sy=Y(sh.y),pr=sc*0.5*(1+0.15*Math.sin(performance.now()/60));
  g.fillStyle='#ff9d45';g.beginPath();g.arc(sx,sy,pr,0,7);g.fill();
  g.fillStyle='#ffd24a';g.beginPath();g.arc(sx,sy,pr*0.55,0,7);g.fill();
 }
 for(const b of blasts){
  const k=1-b.t/b.t0,bx=X(b.x),by=Y(b.y),brad=b.r*sc*(0.3+0.7*k);
  g.globalAlpha=Math.max(0,b.t/b.t0);
  g.fillStyle=b.c;g.beginPath();g.arc(bx,by,brad,0,7);g.fill();
  g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(bx,by,brad,0,7);g.stroke();g.globalAlpha=1;
 }
 for(const n of novas){   // vibrating electric shockwave
  const k=1-n.t/n.t0,nx=X(n.x),ny=Y(n.y);
  g.globalAlpha=Math.max(0,n.t/n.t0);
  for(let ring=0;ring<3;ring++){
   const rr=n.r*sc*(0.25+0.75*k)*(1-ring*0.22);
   g.strokeStyle=n.c;g.lineWidth=4-ring;
   g.beginPath();
   for(let i=0;i<=26;i++){
    const a=i/26*Math.PI*2,vib=(Math.random()-0.5)*sc*0.35*(1-k*0.5);
    const px2=nx+Math.cos(a)*(rr+vib),py2=ny+Math.sin(a)*(rr+vib);
    if(i)g.lineTo(px2,py2);else g.moveTo(px2,py2);
   }
   g.stroke();
  }
  g.globalAlpha=1;
 }
 // robots: ground level first (bridge will cover those in tunnels)
 function drawOne(b,col){
  const px=X(b.x),py=Y(b.y),r=R*sc,a=b.ang;
  // team underglow: neon light spilling from under the chassis
  g.save();
  g.shadowColor=col;g.shadowBlur=22;
  g.globalAlpha=0.4;g.fillStyle=col;
  g.beginPath();g.ellipse(px,py+r*0.95,r*1.2,r*0.55,0,0,7);g.fill();
  g.restore();g.globalAlpha=1;
  // elevation shadow (on bridge = higher)
  if(b.elev===1){
   g.fillStyle='rgba(0,0,0,.35)';
   g.beginPath();g.ellipse(px+6,py+10,r*0.9,r*0.5,0,0,7);g.fill();
  }
  // lunar skin glow
  if(b===me&&save.skin==='lunar'){
   g.shadowColor='#e8f4ff';g.shadowBlur=18;
   g.strokeStyle='rgba(232,244,255,.6)';g.lineWidth=2;
   g.beginPath();g.arc(px,py,r*1.3,0,7);g.stroke();
   g.shadowBlur=0;
  }
  b.buffs.forEach((bf,i)=>{const rr=r*(1.6+0.22*i),left=Math.max(0,1-bf.taken/BUFF_LIFE);g.strokeStyle=BUFF[bf.k].c;g.lineWidth=2.5;
   g.globalAlpha=0.2;g.beginPath();g.arc(px,py,rr,0,7);g.stroke();g.globalAlpha=1;
   g.beginPath();g.arc(px,py,rr,-Math.PI/2,-Math.PI/2+Math.PI*2*left);g.stroke();});
  if(spdMult(b)>1&&b.trail){b.trail.forEach((t,i)=>{g.globalAlpha=0.08+0.05*i;g.fillStyle=col;g.beginPath();g.arc(X(t.x),Y(t.y),r*0.7,0,7);g.fill();});g.globalAlpha=1;}
  drawTank(b,col);
 }
 for(const u of units)if(u.team===1&&(u.elev||0)===0&&u.hp>0)drawOne(u,TC[1]);
 for(const u of units)if(u.team===0&&(u.elev||0)===0&&u.hp>0)drawOne(u,TC[0]);
 // draw bridge OVER ground units (tunnel effect)
 const br2=MAPS[curMap].bridge;
 if(br2){
  for(const [sx,sy,sw,sh] of br2.segs){
   g.fillStyle='rgba(0,0,0,.45)';g.fillRect(X(sx)+5,Y(sy)+7,sw*sc,sh*sc);
   g.fillStyle='#3d4260';g.fillRect(X(sx),Y(sy),sw*sc,sh*sc);
   g.fillStyle='#6a7095';g.fillRect(X(sx),Y(sy),sw*sc,Math.max(4,sc*0.3));
   g.strokeStyle='#ffd24a';g.lineWidth=2;g.setLineDash([8,6]);
   g.strokeRect(X(sx),Y(sy),sw*sc,sh*sc);g.setLineDash([]);
  }
 }
 // elevated units on top of bridge
 for(const u of units)if(u.team===1&&(u.elev||0)===1&&u.hp>0)drawOne(u,TC[1]);
 for(const u of units)if(u.team===0&&(u.elev||0)===1&&u.hp>0)drawOne(u,TC[0]);
 // buff chips (arena top corners) and pickup pop-ups
 const chips=(r,x0,dir)=>{r.buffs.forEach((b,i)=>{const w=sc*1.7,h=sc*0.9,x=dir>0?x0+i*(w+3):x0-w-i*(w+3),y=Y(0)+4;
  g.fillStyle=BUFF[b.k].c;g.fillRect(x,y,w,h);g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x,y+h-3,w*(1-b.taken/BUFF_LIFE),3);
  g.fillStyle='#10161d';g.textAlign='center';g.textBaseline='middle';g.font=font(Math.round(sc*0.55));g.fillText(BUFF[b.k].n,x+w/2,y+h/2-1);});g.textBaseline='top';};
 chips(me,X(0)+4,1);
 for(const q of pops){g.globalAlpha=Math.min(1,q.t);g.fillStyle=q.c;g.textAlign='center';g.font=font(Math.round(sc*0.8));g.fillText(q.txt,X(q.x),Y(q.y)-sc*(1.4-q.t)*1.2-sc);g.globalAlpha=1;}
 // damage numbers: shown on the robot that was hit, in the shooter's color
 for(const q of nums){g.globalAlpha=Math.min(1,q.t/0.4)*(q.g?0.7:1);g.fillStyle=q.c;g.textAlign='center';g.font=font(Math.round(sc*0.62*(q.z||1)));g.fillText(q.txt,X(q.x),Y(q.y)-sc*(0.9-q.t)*1.6);g.globalAlpha=1;}
 g.restore();
 // HUD: team health bars + survivors
 const hy=oy-HUD*sc+sc*0.5,bw=sc*7.4,bh=sc*0.8;
 g.textBaseline='top';g.font=font(Math.round(sc*0.9));
 g.fillStyle=TC[0];g.textAlign='left';g.fillText('YOU'+(MODES[modeKey()].n>1?' ×'+aliveCount(0):''),X(0),hy-sc*0.05);
 g.fillStyle=TC[1];g.textAlign='right';g.fillText('FOES'+(MODES[modeKey()].n>1?' ×'+aliveCount(1):''),X(W),hy-sc*0.05);
 bar(X(0),hy+sc*1.05,bw,bh,teamHpFrac(0),TC[0],false);
 bar(X(W)-bw,hy+sc*1.05,bw,bh,teamHpFrac(1),TC[1],true);
 const tl=Math.max(0,Math.ceil(timeLeft)),mm=Math.floor(tl/60),ss=String(tl%60).padStart(2,'0');
 g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#fff';
 g.textAlign='center';g.font=font(Math.round(sc*1.5));g.fillText(mm+':'+ss,X(W/2),hy-sc*0.1);
 // joystick
 if(joy.on){
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;g.beginPath();g.arc(joy.sx,joy.sy,55,0,7);g.stroke();
  g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.arc(joy.x,joy.y,22,0,7);g.fill();
 }else if(state==='play'&&timeLeft>MATCH-6){
  g.fillStyle='rgba(255,255,255,.75)';g.textAlign='center';g.font=font(Math.round(sc*0.85));
  g.fillText('Drag to move. Fill the meter, then tap SUPER.',X(W/2),Y(H/2)+sc*5);
 }
 // red SUPER button with a progress ring
 if(state==='play'){const B=btn(),f=me.sp/SUPER_MAX,rdy=f>=1&&!me.sup;
  g.fillStyle=rdy?'#e02424':'#3a1a1a';g.beginPath();g.arc(B.x,B.y,B.r,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=5;g.beginPath();g.arc(B.x,B.y,B.r-4,0,7);g.stroke();
  g.strokeStyle=rdy?'#fff':'#ff6b6b';g.beginPath();g.arc(B.x,B.y,B.r-4,-Math.PI/2,-Math.PI/2+Math.PI*2*f);g.stroke();
  g.fillStyle=rdy?'#fff':'rgba(255,255,255,.55)';g.textAlign='center';g.textBaseline='middle';g.font=font(Math.round(B.r*0.42));g.fillText('SUPER',B.x,B.y);g.textBaseline='top';
  if(rdy){g.globalAlpha=0.25+0.25*Math.sin(performance.now()/120);g.strokeStyle='#ff4d4d';g.lineWidth=6;g.beginPath();g.arc(B.x,B.y,B.r+6,0,7);g.stroke();g.globalAlpha=1;}}
 // result overlay
 if(state==='over')drawOver();
}
function drawOver(){
 g.fillStyle='rgba(8,12,18,.9)';g.fillRect(0,0,vw,vh);
 const cx=vw/2,pw=Math.min(vw-48,340),px=cx-pw/2;
 const showStreak=lastWon&&lastStreak>=2;
 const sb=showStreak?Math.min(lastStreak,5):0;
 const nq=lastQuests.length;
 let ph=28+38+24+52+12+52+12+40+32;
 if(showStreak)ph+=30;
 if(sb>0)ph+=26;
 if(nq>0)ph+=30+nq*24;
 const py=Math.max(30,vh/2-ph/2);
 ui.overAgain=null;ui.overMenu=null;
 g.fillStyle='#101722';rr(px,py,pw,ph,16);g.fill();
 g.strokeStyle=lastWon?'#3fd0c9':lastDrawn?'#8fa3b8':'#ff6b6b';g.lineWidth=2;rr(px,py,pw,ph,16);g.stroke();
 let y=py+30;
 g.textAlign='center';g.textBaseline='top';
 const title=lastWon?'VICTORY!':lastDrawn?'DRAW':'DEFEAT';
 g.fillStyle=lastWon?'#3fd0c9':lastDrawn?'#e6ebf0':'#ff6b6b';
 g.font=font(34);g.fillText(title,cx,y);y+=40;
 g.fillStyle='#8fa3b8';g.font=font(13);
 g.fillText(MODES[lastMode].label+' BATTLE',cx,y);y+=24;
 if(showStreak){
  g.fillStyle='#ff9d3c';g.font=font(16);
  g.fillText(lastStreak+' WIN STREAK!',cx,y);y+=30;
 }
 g.fillStyle='#e6ebf0';g.font=font(18);
 g.fillText('+'+lastPts+' PTS',cx,y);y+=26;
 if(sb>0){
  g.fillStyle='#ff9d3c';g.font=font(13);
  g.fillText('INCLUDES +'+lastStreakBonusPts+' PTS STREAK BONUS',cx,y);y+=26;
 }
 if(nq>0){
  y+=8;
  g.fillStyle='#ffd24a';g.font=font(12);
  g.fillText('QUEST COMPLETE',cx,y);y+=22;
  lastQuests.forEach(q=>{
   g.fillStyle='#e6ebf0';g.font=font(14);
   g.fillText(q.n+'  +'+q.pts+' PTS',cx,y);y+=24;
  });
 }
 y+=12;
 ui.overAgain={x:px+24,y:y,w:pw-48,h:52};
 g.fillStyle='#1f9e8e';rr(px+24,y,pw-48,52,12);g.fill();
 g.fillStyle='#fff';g.font=font(18);g.fillText('FIGHT AGAIN',cx,y+16);
 y+=64;
 ui.overMenu={x:px+24,y:y,w:pw-48,h:40};
 g.fillStyle='#1c2632';rr(px+24,y,pw-48,40,10);g.fill();
 g.fillStyle='#8fa3b8';g.font=font(15);g.fillText('MENU',cx,y+11);
}

let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
initTonConnect();
trackVisit();
initBackend();
// block iOS pull-to-refresh and swipe gestures
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
requestAnimationFrame(loop);
</script>
