name = "lunar-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["*/5 * * * *", "* 15-18 * * *"]   # the board and farm check every 5 min; reminders every minute 15:00-18:59 UTC

[vars]
# reminders per run (one run a minute, 15:00-18:59 UTC: 240 runs a day). Workers Free allows 50 outside calls per run,
# so 40 reminders + 3 database calls fit: up to 9,600 players a day. On Workers Paid, raise it to 200 (48,000 a day)
NTF_BATCH = "40"

# Live PvP: one room per match plus the matchmaking lobby. SQLite-backed classes, so they run on the Workers Free plan.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "PvpRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "PvpLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PvpRoom", "PvpLobby"]

# Website and its account API share the Workers origin: first-party cookies work in Safari.
[assets]
directory = "./site-assets"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "WebSession"

[[migrations]]
tag = "v2-web-sessions"
new_sqlite_classes = ["WebSession"]

# Source-only migration. Do not deploy until separately approved.
[[durable_objects.bindings]]
name = "PAYMENTS"
class_name = "PaymentJob"

[[migrations]]
tag = "v3-payment-recovery"
new_sqlite_classes = ["PaymentJob"]

# ---------------------------------------------------------------------------------------------------------------
# ISOLATED $0 CERTIFICATION STAGING. Deployed only by .github/workflows/deploy-staging.yml (manual, never main).
# Separate Worker name => separate workers.dev host, Durable Object storage and passkey RP. Fails closed (503) unless
# its own FIREBASE_DB_URL and WEB_ORIGIN are set and differ from production (worker/src/db.js stageProblem).
# No crons: staging sends no reminders and runs no production jobs. Testnet/devnet only.
[env.staging]
name = "lunar-api-staging"
workers_dev = true
triggers = { crons = [] }

[env.staging.vars]
LUNAR_STAGE = "staging"
NTF_BATCH = "0"
PAYMENT_NETWORK = "testnet"
CRYPTO_CHECKOUT_ENABLED = "test"
STARS_TEST_MODE = "1"
WEB_LOGIN_ENABLED = "1"

[[env.staging.durable_objects.bindings]]
name = "ROOM"
class_name = "PvpRoom"

[[env.staging.durable_objects.bindings]]
name = "LOBBY"
class_name = "PvpLobby"

[[env.staging.durable_objects.bindings]]
name = "SESSIONS"
class_name = "WebSession"

[[env.staging.durable_objects.bindings]]
name = "PAYMENTS"
class_name = "PaymentJob"
