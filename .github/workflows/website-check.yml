name: Website layout and login contracts
on:
  pull_request:
    paths: ['web/**', 'worker/src/web-auth.js', 'worker/src/lunar-identity.js', 'worker/package.json', 'dev/tests/web-login.mjs', 'dev/tests/wtest/web-auth.mjs', '.github/workflows/website-check.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent passkey verifier
        run: npm install --prefix worker --no-audit --no-fund --package-lock=false
      - name: Website syntax and assets
        run: |
          node --check web/website.js
          node --check web/game.js
          node worker/build-web.mjs
      - name: Login handoff and authoritative session contracts
        run: |
          node dev/tests/web-login.mjs
          node dev/tests/wtest/web-auth.mjs
