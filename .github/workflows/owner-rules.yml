name: Owner rules
# Session 6B owner decision 9: fails the build if an owner-decided number changes (DAILY_CAP, CQ_PTS, the quest rewards, LG_MULT,
# the Sortie chain, the research rules), a guard test is loosened, a CP source or sink appears, the chassis kit model or the
# Science Lab tree leaves its window, or code hides after a // comment. The limits live in docs/owner-rules.json, which only an
# owner-decided prompt may change. Runs on every pull request and every push to main, whatever the paths.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # docs/owner-rules.json changes only with the owner's 'owner-rules-change' label on the pull request (its creation is exempt)
      - name: The owner-rules file changes only with the owner's label
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git cat-file -e FETCH_HEAD:docs/owner-rules.json 2>/dev/null && ! git diff --quiet FETCH_HEAD -- docs/owner-rules.json; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'owner-rules-change') }}" != "true" ]; then
              echo "::error::docs/owner-rules.json changed without the owner's 'owner-rules-change' label"; exit 1
            fi
          fi
      - name: Owner rules
        run: node dev/tests/owner-rules.mjs
