name: Conquest regression
on:
  pull_request:
    paths: ['web/account-prompts.js', 'web/play.html', 'worker/sim-api.js', 'js/conquest/**', 'js/fx3d.js', 'worker/src/conquest*.js', 'worker/src/eco.js', 'worker/src/pvp.js', 'js/rules.js', 'js/game.js', 'js/models3d.js', 'js/render3d.js', 'js/ui.js', 'wiki.html', 'worker/build-sim.mjs', 'dev/tests/wtest/conquest*', 'css/conquest.css', 'dev/tests/conquest*', '.github/workflows/conquest-check.yml', 'js/fx.js', 'js/net.js', 'js/core.js', 'js/main.js', 'js/match.js', 'js/render.js', 'js/pvp.js', 'worker/src/index.js', 'worker/src/proof.js', 'dev/tests/mod-behaviors.mjs', 'dev/tests/wtest/research-economy.mjs', 'worker/src/conquest-research.js', 'worker/src/conquest-loot.js', 'dev/tests/lab-store-ui.mjs', 'dev/tests/wtest/lab-store.mjs', 'dev/tests/owner-rules.mjs', 'docs/owner-rules.json', 'dev/tools/economy-model.mjs', 'dev/tools/chassis-kit-model.mjs', 'dev/tests/lib/**', 'js/conquest/battalion.js']
  workflow_dispatch:
jobs:
  conquest:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker dependencies
        run: npm install --prefix worker --no-audit --no-fund --package-lock=false
      - name: Conquest and shared gameplay regressions
        run: |
          bash dev/tests/conquest-regression.sh
          node dev/tests/conquest-authority.mjs
          node dev/tests/conquest-controls.mjs
          node dev/tests/conquest-threat.mjs
          node dev/tests/conquest-economy.mjs
          node dev/tests/conquest-airdrop.mjs
          node dev/tests/wtest/conquest-airdrop.mjs
          node dev/tests/conquest-terraform.mjs
          node dev/tests/conquest-minerals.mjs
          node dev/tests/conquest-vein-economy.mjs
          node dev/tests/conquest-plot.mjs
          node dev/tests/conquest-town.mjs
          node dev/tests/conquest-town-balance.mjs
          node dev/tests/conquest-sheet.mjs
          node dev/tests/conquest-townkit.mjs
          node dev/tests/conquest-copy.mjs
          node dev/tests/conquest-base-progression.mjs
          node dev/tests/wtest/conquest-visit.mjs
          node dev/tests/wtest/conquest-dev.mjs
          node dev/tests/conquest-home-route.mjs
          node dev/tests/wtest/hull-plating.mjs
          node dev/tests/conquest-session.mjs
          node dev/tests/conquest-netcode.mjs
          node dev/tests/conquest-fast-travel.mjs
          node dev/tests/conquest-recall.mjs
          node dev/tests/conquest-first-base.mjs
          node dev/tests/conquest-balance.mjs
          node dev/tests/conquest-session-033.mjs
          node dev/tests/conquest-living-war.mjs
          node dev/tests/conquest-frontline.mjs
          node dev/tests/conquest-adaptive.mjs
          node dev/tests/conquest-opening.mjs
          node dev/tests/conquest-first-hour.mjs
          node dev/tests/conquest-cc-ladder.mjs
          node dev/tests/conquest-loot.mjs
          node dev/tests/conquest-living-world.mjs
          node dev/tests/conquest-sortie-chain.mjs
          node dev/tests/conquest-contracts.mjs
          node dev/tests/conquest-yield-steps.mjs
          node dev/tests/conquest-ladder-check.mjs
          node dev/tests/conquest-analytics.mjs
          node dev/tests/conquest-operations.mjs
          node dev/tests/conquest-base.mjs
          node dev/tests/conquest-raid-layouts.mjs
          node dev/tests/conquest-raids.mjs
          node dev/tests/conquest-raid-doctrine.mjs
          node dev/tests/conquest-drones.mjs
          node dev/tests/conquest-airborne-loot.mjs
          node dev/tests/conquest-defense-config.mjs
          node dev/tests/conquest-defense-victory.mjs
          node dev/tests/conquest-sector-authority.mjs
          node dev/tests/conquest-sector-victory.mjs
          node dev/tests/conquest-frontier-recovery.mjs
          node dev/tests/conquest-war-authority.mjs
          node dev/tests/conquest-warfront.mjs
          node dev/tests/conquest-cosmetics.mjs
          node dev/tests/conquest-cosmetics-authority.mjs
          node dev/tests/conquest-assets.mjs
          node dev/tests/conquest-style.mjs
          # Session 5E-2d1: the one model list of the code-built world (every slot code-built on HIGH and LOW inside its box, swap to a model and back)
          node dev/tests/conquest-slots.mjs
          node dev/tests/conquest-flagship-ui.mjs
          node dev/tests/conquest-canvas-contract.mjs
          node dev/tests/wtest/conquest-war.mjs
          node dev/tests/conquest-replay-budget.mjs > docs/conquest-living-war/replay-current.json
          node dev/tests/conquest-v1-migration.mjs
          node dev/tests/conquest-earning-model.mjs
          node dev/tests/conquest-earned-journey.mjs
          node dev/tests/conquest-earned-defense.mjs
          node dev/tests/conquest-long-progression.mjs
          node dev/tests/wtest/conquest.mjs
          # Session 6B: the Science Lab, the research mods in both engines, the POWER chip and zone bands, the Lab store (checkout
          # off) and the owner rules (also their own workflow, on every pull request)
          node dev/tests/conquest-research.mjs
          node dev/tests/wtest/conquest-research.mjs
          node dev/tests/wtest/research-economy.mjs
          node dev/tests/mod-behaviors.mjs
          node dev/tests/conquest-power-chip.mjs
          node dev/tests/conquest-allies.mjs
          node dev/tests/lab-store-ui.mjs
          node dev/tests/wtest/lab-store.mjs
          node dev/tests/wtest/proof-mods.mjs
          # Session 6C: the Battalion rules through the Worker's HTTP routes (chips, Role Cores, recruits, field caps, the first Lab
          # grant, ally-only kills, store kinds refused, the cold-blob sweep)
          node dev/tests/wtest/conquest-battalion.mjs
          # Session 7 Living Front: the war's rules decision by decision, the drift simulation, the year-long pace, the alerts
          node dev/tests/conquest-war.mjs
          node dev/tests/conquest-war-drift.mjs
          node dev/tests/conquest-war-pace.mjs
          node dev/tests/conquest-war-alerts.mjs
          node dev/tests/owner-rules.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Portrait player journey
        run: |
          python dev/tests/conquest-onboarding.py
          python dev/tests/conquest-session6-feel.py
          python dev/tests/conquest-session6-loot.py
          python dev/tests/conquest-earned-browser.py
          python dev/tests/conquest-earned-end-to-end.py
          python dev/tests/conquest-preview.py
          CQ_EARNED_SAVE=/tmp/lunar-earned-journey.json python dev/tests/conquest-preview.py
          python dev/tests/conquest-airdrop-browser.py
          python dev/tests/conquest-terraform-captures.py --quality high
          python dev/tests/conquest-minerals-browser.py
          python dev/tests/conquest-base-builder.py
          python dev/tests/conquest-hub-browser.py
          python dev/tests/conquest-find-base.py
          python dev/tests/conquest-plot-ui.py
          python dev/tests/conquest-session5d.py
          python dev/tests/conquest-seethrough-town.py
          python dev/tests/conquest-slots-browser.py
          python dev/tests/conquest-super-fx.py
          python dev/tests/conquest-war-browser.py
      - name: Desktop keyboard journey (website build)
        run: python dev/tests/conquest-desktop-keys.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-gameplay-evidence
          path: |
            docs/conquest-session-031
            docs/conquest-session-2
            docs/conquest-living-war/replay-current.json
            docs/economy/phase1
            docs/economy/phase2
            docs/economy/phase3
            docs/conquest/session5
            docs/conquest/session5b
            docs/conquest/base-ui
            docs/conquest/session5d
            docs/conquest/session5e2d1/slots
            docs/conquest/session5e2d1/town
            docs/conquest/session7

  # Session 6C guardrails (blueprint §12): 2 better gear always helps (every authored encounter and town tier, 3 kits x 4 seeds) and
  # 4 composition matters (a balanced Battalion vs each one-role Battalion). A job of its own: they are long simulations.
  guardrails:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker dependencies
        run: npm install --prefix worker --no-audit --no-fund --package-lock=false
      - name: Guardrails 2 and 4
        run: node dev/tests/conquest-guardrails.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-guardrails
          path: docs/conquest/session6c

  transmission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker dependencies
        run: npm install --prefix worker --no-audit --no-fund --package-lock=false
      - name: Install browser engine
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Visible acknowledgement and independent story scrolling
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python dev/tests/conquest-transmission.py --engine ${{ matrix.engine }}
          python dev/tests/conquest-occluder.py --engine ${{ matrix.engine }}
          python dev/tests/conquest-session-032.py --engine ${{ matrix.engine }}
          python dev/tests/conquest-session-033.py --engine ${{ matrix.engine }}
          python dev/tests/conquest-session-033.py --engine ${{ matrix.engine }} --fallback
          python dev/tests/conquest-living-war.py --engine ${{ matrix.engine }} --quality high
          python dev/tests/conquest-living-war.py --engine ${{ matrix.engine }} --fallback
          python dev/tests/conquest-flagship-browser.py --engine ${{ matrix.engine }} --width 390
          python dev/tests/conquest-flagship-browser.py --engine ${{ matrix.engine }} --width 320 --family siege --no-defense
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conquest-transmission-${{ matrix.engine }}
          path: |
            docs/conquest-ios-onboarding
            docs/conquest-session-032
            docs/conquest-session-033
            docs/conquest-living-war
            docs/conquest-session-2
