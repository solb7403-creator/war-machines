name: Conquest regression
on:
  workflow_dispatch:
jobs:
  webkit-diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix worker --no-audit --no-fund --package-lock=false
      - run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps webkit
      - name: A. fallback as in CI, browser log on
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          DEBUG: 'pw:browser'
        run: python dev/tests/conquest-living-war.py --engine webkit --fallback 2>&1 | tail -150; free -m
      - name: B. fallback with sound off (save.sound=false)
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          DEBUG: 'pw:browser'
        run: |
          sed 's/save.gfx=\\"2d\\";/save.gfx=\\"2d\\";save.sound=false;/' dev/tests/conquest-living-war.py > dev/tests/diag-living-war-nosound.py
          grep -c 'save.sound=false' dev/tests/diag-living-war-nosound.py
          python dev/tests/diag-living-war-nosound.py --engine webkit --fallback 2>&1 | tail -80
      - name: C. fallback again (repeatability)
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python dev/tests/conquest-living-war.py --engine webkit --fallback 2>&1 | tail -30
