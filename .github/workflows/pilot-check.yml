name: Pilot check (read-only)
# Run by hand with a Telegram username: that pilot's last match tickets and results, starts today, rate counter and
# flags. Reads only; changes nothing. Results come back as job annotations.
on:
  workflow_dispatch:
    inputs:
      user: { description: 'Telegram username (the admin pin) or tg_<id>', required: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          DB: ${{ secrets.FIREBASE_DB_SECRET }}
          BOT: ${{ secrets.BOT_TOKEN }}
          U: ${{ inputs.user }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,time
          B='https://warmachines-a6034-default-rtdb.firebaseio.com/';A='.json?auth='+os.environ['DB'].strip()
          g=lambda p:json.load(urllib.request.urlopen(B+p+A))
          u=os.environ['U'].lower().lstrip('@')
          P=g('players') or {};now0=time.time()*1000
          act=sorted([[k,v.get('name'),v.get('pts'),round((now0-(v.get('seen') or 0))/60000),v.get('vg'),v.get('wins')] for k,v in P.items() if isinstance(v,dict)],key=lambda r:r[3])[:12]
          print('::notice title=recent::'+json.dumps(act))
          ago=lambda t:round((now0-(t or 0))/60000)
          pays=g('payments') or {};pl=sorted([[k[:40],v.get('cur'),v.get('amt'),v.get('verified'),v.get('granted'),v.get('item')] for k,v in pays.items() if isinstance(v,dict)],key=lambda r:r[0])[-6:]
          sp=g('starsPaid') or {};spl=[[pid2,c,ago(x.get('ts')),x.get('k'),x.get('t')] for pid2,cs in sp.items() for c,x in (cs or {}).items()];spl.sort(key=lambda r:r[2])
          ws=urllib.request.Request(B+'diag/ping'+A,data=json.dumps({'t':int(now0)}).encode(),method='PUT')
          try: wr=urllib.request.urlopen(ws).read().decode()[:200]
          except Exception as e: wr='WRITE FAILED '+str(e)+' '+(e.read().decode()[:300] if hasattr(e,'read') else '')
          def cw(silent):
            r0=urllib.request.urlopen(urllib.request.Request(B+'diag/cw'+A,headers={'X-Firebase-ETag':'true'}));tag=r0.headers.get('ETag')
            rq=urllib.request.Request(B+'diag/cw'+A+('&print=silent' if silent else ''),data=json.dumps({'t':int(now0),'s':silent}).encode(),method='PUT',headers={'if-match':tag,'Content-Type':'application/json'})
            try: r1=urllib.request.urlopen(rq);return [r1.status,r1.read().decode()[:120]]
            except Exception as e: return ['ERR',str(e),(e.read().decode()[:300] if hasattr(e,'read') else '')]
          T='https://api.telegram.org/bot'+os.environ['BOT'].strip()+'/'
          tg=lambda m:json.load(urllib.request.urlopen(T+m)).get('result')
          try:
            me=tg('getMe');ph=tg('getUserProfilePhotos?user_id='+str(me['id']))
            print('::notice title=botprofile::'+json.dumps({'name':me.get('first_name'),'user':me.get('username'),'desc':(tg('getMyDescription') or {}).get('description'),'about':(tg('getMyShortDescription') or {}).get('short_description'),'photos':ph.get('total_count'),'cmds':[c['command'] for c in tg('getMyCommands') or []],'menu':tg('getChatMenuButton')}))
          except Exception as e: print('::notice title=botprofile::ERR '+str(e)[:200])
          print('::notice title=condwrite::'+json.dumps({'plain':cw(False),'silent':cw(True)}))
          print('::notice title=health::'+json.dumps({'lb_built_min_ago':ago((g('lb') or {}).get('t')),'revc':g('meta/revc'),'starsPaid':spl[:6],'payments':pl,'test_write':wr}))
          lb=g('lb') or {};print('::notice title=board::'+json.dumps({'admin':g('cfg/admin'),'top':[r[:4] for r in lb.get('top',[])[:8]],'n':lb.get('n')}))
          pid=u if u.startswith('tg_') else g('lb')['top'][int(u[4:])-1][0] if u.startswith('rank') else 'tg_'+str(g('cfg/admin/'+u))
          S=g('eco/'+pid) or {}
          now=time.time()*1000;day=int(now//86400000)
          out={'pid':pid,'now':int(now),'mt':S.get('mt'),'md':S.get('md'),'mh':S.get('mh'),'rq':S.get('rq'),'bp_le':(S.get('bp') or {}).get('le'),'bp_ls':(S.get('bp') or {}).get('ls'),
               'dy':((S.get('bp') or {}).get('dy') or {}).get(str(day)),'streak':S.get('streak'),'wins':S.get('wins'),'mp':S.get('mp'),'earned':S.get('earned'),'dailyPts':S.get('dailyPts'),'rev':S.get('rev'),'t':S.get('t'),
               'flags':g('flags/'+pid),'cfg':{k:v for k,v in (g('cfg') or {}).items() if k!='admin'}}
          def tg(m,body):
            try: return json.load(urllib.request.urlopen(urllib.request.Request('https://api.telegram.org/bot'+os.environ['BOT']+'/'+m,data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})))
            except Exception as e: return {'err':str(e),'body':(e.read().decode()[:300] if hasattr(e,'read') else '')}
          botid=int(os.environ['BOT'].split(':')[0])
          ch=tg('getChat',{'chat_id':'@LUNARmemecoin'});chs=(ch.get('result') or {})
          print('::notice title=channel::'+json.dumps({'chat':{k:chs.get(k) for k in ('id','type','title','username')} if chs else ch,'bot_in_channel':tg('getChatMember',{'chat_id':'@LUNARmemecoin','user_id':botid}),'me':(tg('getMe',{}).get('result') or {}).get('username'),
            'pilot_in_channel':tg('getChatMember',{'chat_id':'@LUNARmemecoin','user_id':int(pid[3:])}) if pid.startswith('tg_') else None,'quests':{k:(S.get('q') or {}).get(k) for k in ('q_tg','q_x','q_wiki')}})[:1500])
          bad=[];sizes={}
          def walk(v,path):
            if isinstance(v,dict):
              for k,x in v.items():
                if k=='' or any(c in k for c in '.$#[]/') or len(k.encode())>700 or any(ord(c)<32 or ord(c)==127 for c in k): bad.append(path+'/'+repr(k))
                walk(x,path+'/'+k)
            elif isinstance(v,list):
              for i,x in enumerate(v): walk(x,path+'/'+str(i))
            elif isinstance(v,float) and (v!=v or v in (float('inf'),float('-inf'))): bad.append(path+' = '+repr(v))
          walk(S,'')
          for k,v in S.items(): sizes[k]=len(json.dumps(v))
          out['vg']=S.get('vg');out['vgg']=S.get('vgg');out['bad_keys']=bad[:20];out['size']=len(json.dumps(S));out['big']=sorted(sizes.items(),key=lambda x:-x[1])[:10]
          out['bp']={k:(v if k!='g' else len(v)) for k,v in (S.get('bp') or {}).items()} if isinstance(S.get('bp'),dict) else S.get('bp')
          out.pop('md',None)
          s=json.dumps(out,separators=(',',':'))
          for i in range(0,len(s),900): print('::notice title=pilot %d::'%(i//900)+s[i:i+900])
          PY
