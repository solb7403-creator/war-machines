name: Deploy Stars server (Cloudflare)
# Deploys worker/ to Cloudflare Workers (with the live-match Durable Objects), sets its secrets, and points the
# Telegram bot webhook at it. The live-match server runs the game's own sim, so js/game.js and js/rules.js deploy it too.
# Before deploying: the server tests, and a live-match smoke test in the real Workers runtime (wrangler dev).
on:
  push:
    branches: [main]
    paths: ['worker/**', 'js/game.js', 'js/rules.js', 'web/**', 'css/**', 'js/**', 'version.json', 'dev/tests/wtest/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install independent passkey verifier
        run: npm install --prefix worker --no-audit --no-fund --package-lock=false
      - name: Check secrets
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT: ${{ secrets.BOT_TOKEN }}
          DB: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          [ -n "$CF" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          [ -n "$BOT" ] || echo "::warning::BOT_TOKEN missing: Telegram extras unavailable; independent Lunar website deployment continues"
          [ -n "$DB" ] || { echo "::error::FIREBASE_DB_SECRET secret missing"; exit 1; }
      - name: Build the match sim (js/rules.js + js/game.js -> worker/src/sim.gen.js)
        run: node worker/build-sim.mjs
      - name: Package official website assets
        run: node worker/build-web.mjs
      - name: Website login handoff regression
        run: node dev/tests/web-login.mjs
      - name: Defender flagship 3D geometry verification
        run: node dev/tests/defender-visual.mjs
      - name: Server tests (points, payments, live matches, farm defense)
        run: |
          node dev/tests/wtest/test.mjs
          node dev/tests/wtest/pvp.mjs
          node dev/tests/wtest/farm.mjs
          node dev/tests/wtest/web-auth.mjs
          node dev/tests/wtest/lunar-identity.mjs
          node dev/tests/wtest/lab.mjs
          node dev/tests/wtest/lab-battle.mjs
          node dev/tests/wtest/ticket-reliability.mjs
      - name: Live-match smoke test in the Workers runtime
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx -y --package=wrangler@4 -c 'node smoke-runtime.mjs'
      - name: Find account + ensure workers.dev subdomain
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC=$(curl -s -H "Authorization: Bearer $CF" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          [ -n "$ACC" ] && [ "$ACC" != "null" ] || { echo "::error::token can't list accounts: $(curl -s -H "Authorization: Bearer $CF" https://api.cloudflare.com/client/v4/accounts | head -c 500)"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV
          SUB=$(curl -s -H "Authorization: Bearer $CF" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for name in lunarwarmachines lunarwm lunar-war-machines lunarwarmachines-$RANDOM; do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CF" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$name\"}" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain)
              echo "$R" | jq -e '.success' >/dev/null && { SUB=$name; break; }
              echo "subdomain $name: $(echo $R | head -c 300)"
            done
          fi
          [ -n "$SUB" ] || { echo "::error::could not set up workers.dev subdomain"; exit 1; }
          echo "::notice::workers.dev subdomain: $SUB"
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
          TELEGRAM_OIDC_CLIENT_SECRET: ${{ secrets.TELEGRAM_OIDC_CLIENT_SECRET }}
          WEB_LOGIN_ENABLED: ${{ vars.WEB_LOGIN_ENABLED }}
        run: |
          set -o pipefail
          run() { "$@" 2>&1 | tee -a out.txt || { m=$(tail -c 2500 out.txt | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' ' '); echo "::error::$m"; exit 1; }; }
          run npx -y wrangler@4 deploy --var WEB_LOGIN_ENABLED:"${WEB_LOGIN_ENABLED:-1}"
          if [ -n "$BOT_TOKEN" ]; then
            BOT_TOKEN=$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')   # a pasted secret can carry a stray space or newline
            printf '%s' "$BOT_TOKEN" | run npx -y wrangler@4 secret put BOT_TOKEN
          else
            echo "::notice::Lunar account service deployed without a Telegram bot token"
          fi
          FIREBASE_DB_SECRET=$(printf '%s' "$FIREBASE_DB_SECRET" | tr -d '[:space:]')
          printf '%s' "$FIREBASE_DB_SECRET" | run npx -y wrangler@4 secret put FIREBASE_DB_SECRET
          # Only use the private BotFather OIDC secret in the Worker; never expose it as a public --var.
          if [ -n "$TELEGRAM_OIDC_CLIENT_SECRET" ]; then
            printf '%s' "$TELEGRAM_OIDC_CLIENT_SECRET" | run npx -y wrangler@4 secret put TELEGRAM_OIDC_CLIENT_SECRET
          else
            echo "::warning::Website redirect login still needs TELEGRAM_OIDC_CLIENT_SECRET in GitHub Actions secrets"
          fi
          URL=$(grep -oE 'https://lunar-api\.[a-z0-9-]+\.workers\.dev' out.txt | head -1)
          echo "WORKER_URL=$URL" >> $GITHUB_ENV
          echo "::notice::WORKER_URL=$URL"
      - name: Optional Telegram bot webhook setup (website works without Telegram)
        continue-on-error: true
        env:
          LUNAR_TELEGRAM_OPTIONAL: '1'
        run: echo 'Telegram integration is optional; failure to update Telegram cannot block the independent website.'
      - name: Point bot webhook at the worker
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          [ -n "$WORKER_URL" ] || { echo "::error::worker URL not found (is the workers.dev subdomain set up?)"; exit 1; }
          export BOT_TOKEN=$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')
          SECRET=$(node -e 'const c=require("crypto");process.stdout.write(c.createHmac("sha256",process.env.BOT_TOKEN).update("lunar-webhook").digest("hex").slice(0,48))')
          R=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" -H 'Content-Type: application/json' \
            -d "{\"url\":\"${WORKER_URL}/api/tg-webhook\",\"secret_token\":\"${SECRET}\",\"allowed_updates\":[\"message\",\"pre_checkout_query\"]}")
          echo "::notice::setWebhook: $R"
          echo "$R" | grep -q '"ok":true' || exit 1
          C=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/setMyCommands" -H 'Content-Type: application/json' -d '{"commands":[
            {"command":"start","description":"Play LUNAR: War Machines"},
            {"command":"support","description":"Get help with the game"},
            {"command":"paysupport","description":"Help with a purchase"},
            {"command":"terms","description":"Terms of service"},
            {"command":"stop","description":"Turn off daily reminders"}]}')
          echo "::notice::setMyCommands: $C"
      - name: Live matches answer
        run: |
          for i in 1 2 3 4 5; do H=$(curl -s "$WORKER_URL/pvp/health"); echo "$H" | grep -q '"ok":true' && break; sleep 5; done
          echo "::notice::pvp health: $H"
          echo "$H" | grep -q '"ok":true' || { echo "::error::live-match lobby not answering: $H"; exit 1; }
