name: One-time admin grant (owner all gear) — temporary
# Owner-authorized one-off (Nov 14, 2026): every chassis and weapon on the owner's own account (OWNER_PID, hard-coded in
# the script). Runs only on pushes to the ops/owner-all-gear-20261114 branch; removed after use.
on:
  push:
    branches: [ops/owner-all-gear-20261114]
jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          DB: ${{ secrets.FIREBASE_DB_SECRET }}
        run: node dev/ops/owner-all-gear.mjs
