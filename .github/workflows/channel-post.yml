name: Channel posts
# Posts queued messages to the Telegram news channel through the game bot (BOT_TOKEN stays a GitHub secret).
# Queue: dev/channel/queue.json. A post goes out once its time has passed AND it has "approved": true.
# Sent ids are recorded in dev/channel/sent.json (committed back) so nothing posts twice.
# Run by hand with "check" to test that the bot can post to the channel (sends nothing).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode: { description: 'post (send due posts) or check (test bot admin rights only)', required: true, default: 'check' }
permissions:
  contents: write
concurrency:
  group: channel-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          BOT: ${{ secrets.BOT_TOKEN }}
          MODE: ${{ inputs.mode || 'post' }}
        run: python3 dev/channel/post.py
      - name: Record sent posts
        run: |
          if ! git diff --quiet dev/channel/sent.json; then
            git config user.name "lunar-channel-bot"
            git config user.email "actions@users.noreply.github.com"
            git add dev/channel/sent.json
            git commit -m "Channel: record sent posts"
            git pull --rebase origin main && git push
          fi
