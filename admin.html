<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUNAR: War Machines · Admin</title>
<style>
body{background:#0c1118;color:#e6ebf0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:24px 16px}
.wrap{max-width:560px;margin:0 auto}h1{font-size:20px;letter-spacing:2px}.card{background:#141c26;border:1px solid #233042;border-radius:12px;padding:14px;margin:12px 0}
.mut{color:#8fa3b8;font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 4px;border-bottom:1px solid #233042}td.n{text-align:right}
</style>
</head>
<body><div class="wrap">
<h1>☾ ADMIN</h1>
<div class="card"><b>Revenue and player stats moved into the game.</b>
<p class="mut">Player records are private now (only the game server can write or read them). To see players, revenue and recent payments: open the game in Telegram → Shop → tap the word SHOP five times.</p></div>
<div class="card"><b>Public leaderboard (top 25)</b> <span class="mut" id="upd"></span><table id="t"></table></div>
</div>
<script>
fetch('https://warmachines-a6034-default-rtdb.firebaseio.com/lb.json').then(r=>r.json()).then(lb=>{
 if(!lb||!lb.top){document.getElementById('upd').textContent='· not built yet';return;}
 document.getElementById('upd').textContent='· '+lb.n+' players · updated '+new Date(lb.t).toLocaleTimeString();
 document.getElementById('t').innerHTML=lb.top.slice(0,25).map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+String(r[1]).replace(/</g,'&lt;')+'</td><td class="n">'+Number(r[2]).toLocaleString()+'</td><td class="n">'+r[3]+'d</td></tr>').join('');
}).catch(()=>{document.getElementById('upd').textContent='· unavailable';});
</script>
</body>
</html>
