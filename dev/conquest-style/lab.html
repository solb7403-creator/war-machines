<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LUNAR Conquest style lab</title>
<!-- Dev-only Phase 1 visual-option harness. Never linked from the game; no auth, saves, network or economy. -->
<link rel="stylesheet" href="../../css/conquest.css">
<style>
@font-face{font-family:"Chakra Petch";src:url(../../fonts/chakra-petch-600.woff) format("woff");font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:"Chakra Petch";src:url(../../fonts/chakra-petch-700.woff) format("woff");font-weight:700;font-style:normal;font-display:block}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Chakra Petch',system-ui,sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#lab-tag{position:fixed;left:8px;bottom:8px;z-index:20000;font:600 11px/1.35 system-ui,sans-serif;color:#fff;background:#000a;padding:4px 7px;border-radius:4px;pointer-events:none;max-width:70vw}
#lab-error{position:fixed;inset:auto 8px 40px 8px;z-index:20001;color:#ffb4a8;background:#300c;font:12px/1.4 monospace;padding:8px;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="lab-tag"></div>
<pre id="lab-error"></pre>
<script src="../../js/rules.js"></script>
<script src="../../js/vendor/three.lunar.min.js"></script>
<script src="../../js/models3d.js"></script>
<script src="../../js/graphics.js"></script>
<script src="../../js/equipment3d.js"></script>
<script src="../../js/conquest/world.js"></script>
<script src="../../js/conquest/discovery.js"></script>
<script src="../../js/conquest/combat.js"></script>
<script src="../../js/conquest/assets.js"></script>
<script src="lab.js"></script>
</body>
</html>
