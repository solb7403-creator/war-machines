<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNAR authored asset inspection</title>
<style>html,body{margin:0;background:#07111b;color:#def5ff;font:14px system-ui}canvas{display:block;width:100vw;height:70vh}main{padding:16px}strong{color:#a1eaf2}select{padding:10px;background:#132636;color:white}p{max-width:40em}</style>
<main><strong>LUNAR / CLOUD BLENDER INSPECTION</strong><p>Original authored command citadel and Parasite plasma battery. Asset inspection only; gameplay proof is recorded separately.</p><select id="asset"><option value="command">Command citadel</option><option value="raid">Parasite plasma battery</option><option value="smoke">Smoke cube</option></select> <select id="quality"><option>high</option><option>low</option></select><p id="metrics"></p></main>
<script src="/js/vendor/three.lunar.min.js"></script><script src="/js/conquest/assets.js"></script><script>
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight*.7);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#07111b');const camera=new THREE.PerspectiveCamera(40,innerWidth/(innerHeight*.7),.1,200);camera.position.set(24,20,27);camera.lookAt(0,5,0);scene.add(new THREE.HemisphereLight(0xd3ebff,0x243141,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-15,25,15);scene.add(sun);
const floor=new THREE.Mesh(new THREE.BoxGeometry(50,.3,50),new THREE.MeshStandardMaterial({color:0x182632,roughness:1}));floor.position.y=-.25;scene.add(floor);let art;
async function update(){await ConquestAssets.load(THREE);if(art)scene.remove(art);art=asset.value==='smoke'?ConquestAssets.parse(THREE,await(await fetch('/dev/assets/conquest/smoke.glb')).arrayBuffer()):ConquestAssets.make(THREE,asset.value,quality.value);if(!art)throw Error(ConquestAssets.status.error);scene.add(art);window.assetReady=true;renderer.render(scene,camera);metrics.textContent=JSON.stringify(art.userData.assetMetrics||ConquestAssets.metrics[asset.value+'-'+quality.value]);window.assetStats={draws:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures};}
asset.onchange=quality.onchange=()=>{window.assetReady=false;update()};update();
</script></html>
